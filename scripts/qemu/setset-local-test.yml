- hosts: filtering
  become: yes
  tasks:
    - name: test load
      shell: modprobe xt_setset

    - name: verify xtables match is registered
      shell: iptables -m setset -h | grep -q setset

    - name: verify banset module and xtables match are registered
      shell: |
        modprobe xt_banset
        iptables -m banset -h | grep -q -- '--ban-set'

    - name: test setset rule parsing
      shell: |
        set -e

        cleanup() {
          iptables -w -F SETSET_CI 2>/dev/null || true
          iptables -w -X SETSET_CI 2>/dev/null || true
          ipset destroy setset_ci_add 2>/dev/null || true
          ipset destroy setset_ci_del 2>/dev/null || true
        }
        trap cleanup EXIT

        cleanup

        ipset create setset_ci_add hash:ip timeout 60 -exist
        ipset create setset_ci_del hash:ip -exist
        iptables -w -N SETSET_CI
        iptables -w -A SETSET_CI \
          -m setset \
          --ss-add-set setset_ci_add src \
          --ss-exist \
          --ss-timeout 30 \
          --ss-del-set setset_ci_del src \
          -j RETURN
        iptables-save | grep -q -- '--ss-add-set setset_ci_add src'
        iptables-save | grep -q -- '--ss-del-set setset_ci_del src'
        iptables -w -D SETSET_CI \
          -m setset \
          --ss-add-set setset_ci_add src \
          --ss-exist \
          --ss-timeout 30 \
          --ss-del-set setset_ci_del src \
          -j RETURN
      args:
        executable: /bin/bash

    - name: test direct banset control and packet paths
      shell: |
        set -e

        cleanup() {
          iptables -w -D INPUT -i lo -p icmp \
            -m banset --ban-set banset_ci4 --ban-mode match \
            -j DROP 2>/dev/null || true
          ip6tables -w -D INPUT -i lo -p ipv6-icmp \
            -m banset --ban-set banset_ci6 --ban-mode refresh \
            --ban-probability 1 -j DROP 2>/dev/null || true
          ipset destroy banset_ci4 2>/dev/null || true
          ipset destroy banset_ci6 2>/dev/null || true
          ipset destroy banset_expiry 2>/dev/null || true
        }
        trap cleanup EXIT
        cleanup

        ipset create banset_ci4 hash:ip,ip,flag family inet \
          timeout 600 maxelem 262144
        ipset create banset_ci6 hash:ip,ip,flag family inet6 \
          timeout 600 maxelem 262144
        ipset create banset_expiry hash:ip,ip,flag family inet \
          timeout 32 maxelem 262144
        ipset add banset_ci4 127.0.0.1,127.0.0.1,7 timeout 600
        ipset add banset_ci6 ::1,::1,9 timeout 600
        ipset test banset_ci4 127.0.0.1,127.0.0.1,0
        ipset test banset_ci6 ::1,::1,0
        ipset save banset_ci4 | grep -q '127.0.0.1,127.0.0.1,7'
        ipset save banset_ci6 | grep -q '::1,::1,9'

        ipset add banset_expiry 198.51.100.1,192.0.2.1,3 timeout 32
        ipset test banset_expiry 198.51.100.1,192.0.2.1,0

        iptables -w -I INPUT -i lo -p icmp \
          -m banset --ban-set banset_ci4 --ban-mode match -j DROP
        ! ping -c 1 -W 1 127.0.0.1
        iptables-save | grep -q -- '--ban-set banset_ci4 --ban-mode match'

        ip6tables -w -I INPUT -i lo -p ipv6-icmp \
          -m banset --ban-set banset_ci6 --ban-mode refresh \
          --ban-probability 1 -j DROP
        ! ping -6 -c 1 -W 1 ::1
        ip6tables-save | grep -q -- '--ban-set banset_ci6 --ban-mode refresh'

        ipset del banset_ci4 127.0.0.1,127.0.0.1,0
        ! ipset test banset_ci4 127.0.0.1,127.0.0.1,0
        ipset flush banset_ci6
        ! ipset test banset_ci6 ::1,::1,0

        sleep 33
        ! ipset test banset_expiry 198.51.100.1,192.0.2.1,0

        ! ipset create banset_permanent hash:ip,ip,flag family inet
        ! ipset add banset_ci4 10.0.0.0/24,192.0.2.1,1 timeout 600
        ! ipset add banset_ci4 10.0.0.1,192.0.2.1,256 timeout 600
      args:
        executable: /bin/bash

    - name: test banset growth, save restore, flush, and concurrent updates
      shell: |
        set -euo pipefail

        cleanup() {
          ipset destroy banset_growth 2>/dev/null || true
          ipset destroy banset_restore 2>/dev/null || true
        }
        trap cleanup EXIT
        cleanup

        ipset create banset_growth hash:ip,ip,flag family inet \
          timeout 600 maxelem 524288
        seq 0 219999 | awk '
          {
            a = int($1 / 65536); b = int($1 / 256) % 256; c = $1 % 256;
            printf "add banset_growth 10.%d.%d.%d,192.0.2.1,32 timeout 600\n", a, b, c
          }
        ' | ipset restore -exist
        ipset test banset_growth 10.0.0.0,192.0.2.1,0
        ipset test banset_growth 10.3.91.95,192.0.2.1,0

        for attempt in $(seq 1 100); do
          hashsize=$(ipset list banset_growth -terse |
            awk '/^Header:/ { for (i=1; i<=NF; i++) if ($i == "hashsize") print $(i+1) }')
          test "${hashsize:-0}" -gt 32768 && break
          sleep 0.1
        done
        test "${hashsize:-0}" -gt 32768

        ipset save banset_growth |
          sed 's/banset_growth/banset_restore/g' | ipset restore
        ipset test banset_restore 10.1.2.3,192.0.2.1,0

        (
          for i in $(seq 1 2000); do
            ipset add banset_growth 11.0.$((i / 256)).$((i % 256)),192.0.2.2,7 \
              timeout 600 -exist
            ipset del banset_growth 11.0.$((i / 256)).$((i % 256)),192.0.2.2,0 \
              2>/dev/null || true
          done
        ) &
        updater=$!
        for i in $(seq 1 10000); do
          ipset test banset_growth 10.0.0.1,192.0.2.1,0 >/dev/null
        done
        wait "$updater"

        ipset flush banset_growth
        ! ipset test banset_growth 10.0.0.0,192.0.2.1,0
        ipset add banset_growth 198.51.100.1,192.0.2.1,99 timeout 600
        ipset test banset_growth 198.51.100.1,192.0.2.1,0
      args:
        executable: /bin/bash
